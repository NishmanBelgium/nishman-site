<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>État du site — NISHMAN</title>
<meta name="robots" content="noindex, nofollow" />
<!-- Page de contrôle interne. Elle n'affiche rien par elle-même : tout
     vient de /api/diagnostic, qui refuse de répondre à qui n'est pas
     connecté avec le compte de NBD. Aucun secret n'y transite. -->
<style>
  :root { --fond: #0a0a0a; --texte: #f5f5f5; --gris: #a3a3a3;
          --orange: #faa21b; --vert: #22c55e; --rouge: #ef4444;
          --carte: #161616; --bord: #262626; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--fond); color: var(--texte);
         font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
         line-height: 1.55; padding: 24px 16px 64px; }
  main { max-width: 680px; margin: 0 auto; }
  h1 { font-size: 1.35rem; margin: 0 0 4px; letter-spacing: .01em; }
  .sous { color: var(--gris); font-size: .9rem; margin: 0 0 24px; }
  .bandeau { border-radius: 12px; padding: 14px 16px; margin: 0 0 20px;
             border: 1px solid var(--bord); background: var(--carte); font-weight: 600; }
  .bandeau.bon { border-color: var(--vert); }
  .bandeau.mauvais { border-color: var(--rouge); }
  .carte { border: 1px solid var(--bord); background: var(--carte);
           border-radius: 12px; padding: 14px 16px; margin: 0 0 12px; }
  .titre { display: flex; align-items: center; gap: 9px; font-weight: 600; margin-bottom: 5px; }
  .pastille { width: 10px; height: 10px; border-radius: 50%; flex: 0 0 auto; background: var(--gris); }
  .pastille.bon { background: var(--vert); }
  .pastille.mauvais { background: var(--rouge); }
  .detail { color: var(--gris); font-size: .92rem; }
  .meta { color: #6b6b6b; font-size: .8rem; margin-top: 6px; }
  h2 { font-size: .95rem; margin: 26px 0 8px; color: var(--orange);
       text-transform: uppercase; letter-spacing: .06em; }
  ul { margin: 0; padding-left: 20px; } li { margin-bottom: 5px; }
  a { color: var(--orange); }
  .pied { margin-top: 32px; color: #6b6b6b; font-size: .8rem; }
  button { font: inherit; background: none; color: var(--orange);
           border: 1px solid var(--bord); border-radius: 8px;
           padding: 9px 16px; cursor: pointer; margin-top: 18px; }
</style>
</head>
<body>
<main>
  <h1>État du site</h1>
  <p class="sous">Contrôle en lecture seule. Cette page ne crée aucun devis
     et n'envoie aucun courriel.</p>
  <div id="sortie"><p class="detail">Contrôle en cours…</p></div>
  <p class="pied">Page interne — <a href="/">retour au site</a></p>
</main>
<script>
(function () {
  var sortie = document.getElementById("sortie");
  var NOMS = {
    base_de_donnees: "Base de données des comptes",
    script_google:   "Script Google (prix, devis, commandes)",
    registre_tva:    "Registre européen de TVA (VIES)"
  };

  function echappe(t) {
    return String(t == null ? "" : t)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  function carte(cle, etat) {
    var bon = !!(etat && etat.ok);
    var h = '<div class="carte"><div class="titre">'
          + '<span class="pastille ' + (bon ? "bon" : "mauvais") + '"></span>'
          + echappe(NOMS[cle] || cle) + '</div>'
          + '<div class="detail">' + echappe(etat && etat.detail) + '</div>';
    if (etat && etat.longueur != null) {
      h += '<div class="meta">Code interne : ' + etat.longueur + ' caractères'
         + (etat.espaces_autour
             ? ' — des espaces entouraient la valeur, ils ont été retirés automatiquement.'
             : ' — aucun espace parasite.')
         + '</div>';
    }
    return h + '</div>';
  }

  fetch("/api/diagnostic", { headers: { accept: "application/json" } })
    .then(function (r) { return r.json().then(function (d) { return { statut: r.status, d: d }; }); })
    .then(function (rep) {
      if (rep.statut === 404 || !rep.d || !rep.d.ok) {
        sortie.innerHTML =
          '<div class="bandeau mauvais">Page réservée</div>'
        + '<p class="detail">Cette page n\'est lisible qu\'en étant connecté avec '
        + 'l\'adresse de NBD. <a href="/pro/connexion/">Se connecter</a>.</p>';
        return;
      }
      var d = rep.d;
      var h = '<div class="bandeau ' + (d.tout_va_bien ? "bon" : "mauvais") + '">'
            + echappe(d.resume) + '</div>';
      Object.keys(NOMS).forEach(function (cle) {
        if (d.liaisons && d.liaisons[cle]) h += carte(cle, d.liaisons[cle]);
      });
      if (d.consequences && d.consequences.length) {
        h += '<h2>Ce que cela empêche</h2><ul>';
        d.consequences.forEach(function (c) { h += '<li>' + echappe(c) + '</li>'; });
        h += '</ul>';
      }
      h += '<button type="button" id="relancer">Refaire le contrôle</button>';
      sortie.innerHTML = h;
      document.getElementById("relancer")
        .addEventListener("click", function () { location.reload(); });
    })
    .catch(function () {
      sortie.innerHTML = '<div class="bandeau mauvais">Contrôle impossible</div>'
        + '<p class="detail">Le site n\'a pas répondu. Réessayez dans un instant.</p>';
    });
})();
</script>
</body>
</html>
