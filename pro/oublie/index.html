<body>

<main class="cadre">
  <div class="carte-compte">
    <a href="/pro/"><img class="marque" src="/assets/img/nishman.svg" alt="Nishman" /></a>

    <div class="langues langues-carte" role="group" data-t-aria="langue" aria-label="Langue">
      <button type="button" data-langue="fr">FR</button>
      <button type="button" data-langue="en">EN</button>
      <button type="button" data-langue="nl">NL</button>
      <button type="button" data-langue="de">DE</button>
      <button type="button" data-langue="tr">TR</button>
    </div>

    <h1 class="titre-carte" data-t="h_oubli">Mot de passe oublié</h1>
    <p class="intro-carte" data-t="intro_oubli">
      Indiquez l'adresse e-mail de votre compte. Nous vous enverrons un lien
      pour choisir un nouveau mot de passe.
    </p>

    <div class="message" id="message" role="status"></div>

    <form id="form-oubli" novalidate>
      <div class="champ">
        <label for="o-email" data-t="l_email">Adresse e-mail</label>
        <input type="email" id="o-email" autocomplete="email" required />
      </div>
      <button type="submit" class="bouton-plein" id="b-oubli" data-t="b_oubli">Recevoir le lien</button>
    </form>

    <p class="sous-carte">
      <a href="/pro/connexion/" data-t="retour_connexion">Retour à la connexion</a>
    </p>
