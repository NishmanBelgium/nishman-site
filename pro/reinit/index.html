<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title data-t="titre_reinit">Nouveau mot de passe — NISHMAN</title>
<meta name="robots" content="noindex, nofollow" />
<link rel="icon" type="image/png" sizes="32x32" href="/assets/img/favicon-32.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Manrope:wght@400;600;700&display=swap" />
<link rel="stylesheet" href="/assets/css/boutique.css?v=201" />
<link rel="stylesheet" href="/assets/css/compte.css?v=201" />
</head>
<body>

<main class="cadre">
  <div class="carte-compte">
    <a href="/pro/"><img class="marque" src="/assets/img/nishman.svg" alt="Nishman" /></a>

    <div class="langues langues-carte" role="group" data-t-aria="langue" aria-label="Langue">
      <button type="button" data-langue="fr">FR</button>
      <button type="button" data-langue="en">EN</button>
      <button type="button" data-langue="nl">NL</button>
      <button type="button" data-langue="de">DE</button>
      <button type="button" data-langue="tr">TR</button>
    </div>

    <h1 class="titre-carte" data-t="h_reinit">Nouveau mot de passe</h1>
    <p class="intro-carte" data-t="intro_reinit">
      Choisissez un nouveau mot de passe. Toutes vos sessions ouvertes seront
      fermées, sur cet appareil comme sur les autres.
    </p>

    <div class="message" id="message" role="status"></div>

    <form id="form-reinit" novalidate>
      <div class="champ">
        <label for="r-mdp" data-t="l_mdp_nouveau">Nouveau mot de passe</label>
        <input type="password" id="r-mdp" autocomplete="new-password" required />
        <p class="aide" data-t="aide_mdp">Huit caractères minimum.</p>
      </div>
      <div class="champ">
        <label for="r-confirme" data-t="l_mdp_confirme">Confirmer le mot de passe</label>
        <input type="password" id="r-confirme" autocomplete="new-password" required />
      </div>
      <button type="submit" class="bouton-plein" id="b-reinit" data-t="b_enregistrer">Enregistrer</button>
    </form>

    <p class="sous-carte">
      <a href="/pro/connexion/" data-t="retour_connexion">Retour à la connexion</a>
    </p>
  </div>
</main>

<script src="/assets/js/compte-langues.js?v=201"></script>
<script src="/assets/js/compte.js?v=201"></script>
</body>
</html>
