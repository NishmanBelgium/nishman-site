<script>
(function () {
  "use strict";
  /* La tablette reste allumée tant que la page est affichée : sinon
     l'écran s'éteint au bout de deux minutes et le QR disparaît. */
  function veille() {
    if (!navigator.wakeLock) return;
    navigator.wakeLock.request("screen").catch(function () {});
  }
  veille();
  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState === "visible") veille();
  });

  function compteur() {
    fetch("/api/concours")
      .then(function (r) { return r.json(); })
      .then(function (d) {
        document.getElementById("compteur").textContent =
          d && d.participants > 0
            ? d.participants + (d.participants > 1 ? " participants" : " participant")
            : "";
      })
      .catch(function () {});
  }
  compteur();
  setInterval(compteur, 45000);
})();
</script>
